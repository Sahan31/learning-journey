<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <!-- functions lets us reuse code      -->
     <script>
        function function01 () {
            console.log('hello');
            console.log(2+2);
        }
        function01 ();
        function01 ();


        // PARAMETERS 
        function calculateTax (cost, taxPrecent = 0.1) {
            console.log(cost * taxPrecent);
        }
        calculateTax (2000, 0.2);
        calculateTax (5000);
        // taxPrecent = 0.1 when you add line this 0.1 get default value 

     </script>
</body>
</html>
