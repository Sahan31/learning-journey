<body>
    <script>
        // 1
        function createTax(tax) {
            let finalTax = tax * 0.1 ;
            return finalTax;
        }
        console.log(createTax(1000));

        // 2
        function checkAge (age) {
            if (age >= 18) {
                return `adult`;
            } else {
                return `child`;
            }
        }
        console.log(checkAge(17));

        // 3
        function isBothTrue(value1, value2) {
            return value1 && value2; 
        }
        console.log(isBothTrue(2, 2));

        // 4
        function cacululateShipping (price) {
            if (price >= 50 ) {
                shippingFee = 0 ;
            } else if (price < 50) {
                shippingFee = 5 ;
            }
            return price + shippingFee ;
        }
        let shippingFee = '';
        console.log(cacululateShipping(49));

        // 5 
        function checkWeather (temp) {
            if (temp > 30) {
                return `Hot`;
            } else if (temp >= 15 && temp < 30) {
                return `Warm`;
            } else if (temp < 15) {
                return `Cold`;
            }
        }
        console.log(checkWeather(14));


        // 6
        function formatName (firstName, lastName) {
            return `${firstName} ${lastName}`;
        } 
        console.log(formatName('sahan', 'rashmika'));

        // 7
        function checkDiscount (isMember, purchaseAmount) {
            if (isMember && purchaseAmount > 100) {
                return `true`; 
            } else {
                return `false`;
            }
        }
        console.log(checkDiscount(true, 99));

        // 8
        function getGrade (score) {
            if (score >= 80) {
                return `A`;
            } else if (score >=60 && score <=79) {
                return `B`;
            } else if (score >=40 && score <= 59) {
                return `C`;
            } else {
                return `F`;
            }
        }
        console.log (getGrade (30)); 

        // 9
        function checkEvenOrOdd (number) {
            if ((number % 2) === 0) {
                return `Even`;
            } else {
                return `Odd`;
            }
        }
        console.log (checkEvenOrOdd (5));

        // 10
        function findLarger (num1, num2) {
            if (num1 > num2) {
                return `${num1}`;
            } else if (num2 > num1) {
                return `${num2}`
            }
        }
        console.log (findLarger (45, 50));

        // 11
        function checkPass (score1) {
            if (score1 >= 50) {
                return true;
            } else {
                return false;
            }
        }
        console.log(checkPass (49));

        // 12 
        function checkDay (day) {
            if (day === 'Saturday' || day === 'Sunday') {
                return `Weekend`;
            } else {
                return `Weekday`;
            }
        }
        console.log(checkDay ('Sunday'));
        console.log(checkDay ('Monday'));

        // 13
        function canVote (age, hasID) {
            if (age >= 18 && hasID) {
                return true;
            } else {
                return false;
            }
        }
        console.log(canVote(18, true));

        // 14 
        function getTicketPrice (age) {
            if (age <= 5) {
                return `0`;
            } else if (age > 5 && age < 60 ) {
                return `10`;
            } else if (age >= 60) {
                return `5`;
            }
        }
        console.log(getTicketPrice(65));
    </script>
