            }

        // 15 
        function convertToFahrenheit (celcius) {
            let fahrenheit = (celcius * 9/5) + 32;
            return fahrenheit ;
        }
        console.log(convertToFahrenheit(65));

        // 16 
        function convertToCelcius (fahrenheit) {
            let celcius = ((fahrenheit -32)*5/9);
            return celcius ;
        }
        console.log(convertToCelcius(120));

        // 17 
        function convertTemperature (degrees, unit) {
            if (unit === 'C') {
                let result = convertToFahrenheit (degrees);
                return `${result} F` ; 
            } else if (unit === 'F') {
                let result = convertToCelcius (degrees);
                return `${result} C`;
            }
        }
        console.log (convertTemperature(30, 'F'));

        // 18
        function convertLength (lenght, from, to) {
            if (from === 'miles' && to === 'km') {
                let result = lenght * 1.6;
                return `${result}km` ;
            } else if (from === 'km' && to === 'miles') {
                let result = lenght / 1.6 ;
                return `${result}miles` ;
            } else if (from === 'km' && to === 'km') {
                return `${lenght}km`;
            } else if (from === 'miles' && to === 'ft') {
                let result = lenght * 5280;
                return `${result}ft`;
            } else if (from === 'km' && to === 'ft') {
                let result = lenght * 3281 ;
                return `${result}ft`;
            } 

            if (from !== 'km' && from !== 'miles' && from !== 'ft') {
                return `Invalid unit: ${from}`;
            } else if (to !== 'km' && to !== 'miles' && to !== 'ft') {
                return `Invalid unit: ${to}`;
            }
        }
        console.log(convertLength(50, 'miles', 'km' ));
        console.log(convertLength(32, 'km', 'miles' ));
        console.log(convertLength(32, 'km', 'km' ));
        console.log(convertLength(5, 'miles', 'ft' ));
        console.log(convertLength(5, 'km', 'ft' ));
        console.log(convertLength(5, 'lbs', 'km' ));
        console.log(convertLength(5, 'km', 'lbs' ));
