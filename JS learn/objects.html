<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects</title>
</head>
<body>
    <script>
        const product = {
            name : 'socks' ,
            price : 1090 ,
            ['delivery-time']: '1 day',
            rating: {
                stars: 4.5,
                count: 87
            },                              /* this is object inside object and we call it nested object */
            fun: function function1() {
                console.log('function inside object');
            }
        };
        console.log(product);    /* this is dot notation */
        console.log(product.name);
        console.log(product.price);
         

        product.name = 'cotton socks';
        console.log(product);
        
        console.log(product.rating.stars);

        product.fun();  
        /* we default use dot notation */
    </script>

    <script>
        const product2 = {
            name: 'shirt',
            'delivery-time': '1 day',
            rating: {
                stars: 4.5,
                count: 87
            },
            fun: function function1 () {
                console.log('function inside object');
            }
        };
        console.log(product2); /* this is a dot notation */
        console.log(product2.name);

        console.log(product2['name']); /* this is bracket notation */
        /* console.log(product2.delivery-time)  in this - use as minus soo computer trying to do math soo like this one we use bracket notation like below */
        console.log(product2['delivery-time']);

        console.log(product2.rating.count);

        product2.fun () ;


        // built in objects
        // 1. JSON 
        console.log(JSON.stringify(product2));   /* this is how js convert to JSON */

        const jsonString = JSON.stringify(product2);
        console.log(JSON.parse(jsonString));   /* this is how JSON convert to JS */

        // 2. localStorage    ----- save values more permanently (variables are tempory if we refresh the page / close page all variables are deleted )



    </script>




    <script>
        
    </script>
</body>
</html>
