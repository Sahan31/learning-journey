<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>

    <!-- any variables we create inside {} will only exist inside the {} -->

    <button onclick="
        const computerMove = pickComputerMove ();

        let result = '';

        if ('rock' === computerMove) {
            result = 'You Tie';
        } else if ('paper' === computerMove) {
            result = 'You lose';
        } else if ('scissors' === computerMove) {
            result = 'You win';
        }


        alert(`You picked rock. computer pick ${computerMove}. ${result}`)
    ">Rock</button>

    <button onclick="
        const computerMove = pickComputerMove ();

        let result = '';
        
        if (computerMove === 'rock') {
            result = 'You win';
        } else if (computerMove === 'paper') {
            result = 'You tie';
        } else if (computerMove === 'scissors') {
            result = 'You lose';
        }

        alert(`You picked paper. computer pick ${computerMove}. ${result}`)
    ">Paper</button>

    <button onclick="
        const computerMove = pickComputerMove ();

        let result = '';

         if (computerMove === 'rock') {
            result = 'You lose';
        } else if (computerMove === 'paper') {
            result = 'You win';
        } else if (computerMove === 'scissors') {
            result = 'You Tie';
        }

        alert(`You picked scissors. computer pick ${computerMove}. ${result}`)
    ">Scissors</button>
    
    <script>

        function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1/3) {
            computerMove = 'rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
            computerMove = 'paper';
        } else if (randomNumber >= 2/3 && randomNumber < 1) {
            computerMove = 'scissors';
        }

        return computerMove;
        }
    </script>
</body>
</html>
