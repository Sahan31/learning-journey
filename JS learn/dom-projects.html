<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
</head>
<body>
    <p>Youtube Subscribe Button</p>
    <button onclick="
        subscribe () ;
    " class="button1">Subscribe</button>

    <script>
        function subscribe () {
            const buttonElement = document.querySelector('.button1');

            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
            } else {
                buttonElement.innerHTML = 'Subscribe';
            }
        }
    </script>

<br>
<br>
<br>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = + $10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input type="text" placeholder="Cost of order" class="cost" onkeydown="clickEnter(event)">
    <button onclick="
        calculate () ;
    " class="cal-button">Calculate</button>
    <p class="js-total-cost"></p>

    <script>
        function calculate () {
            const inputElement = document.querySelector('.cost');
            let cost = Number(inputElement.value);

            if (cost < 40) {
                cost = cost + 10 ;
            } else {
                cost = cost ;
            }

            document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
        }

        function clickEnter () {
            if (event.key === 'Enter') {
                calculate ();
            }
        }
    </script>
</body>
</html>
