<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<body>
    <!-- variable is like a container , we can save a value like number or string inside and then use it later -->

    <!-- let variable1 = 3;
    let creates a new variables
    variable1 = variable name
    3 = value
    ; = end of instruction -->


    <script>
        let variable1 = 3;
        console.log(variable1);

        let calculation = 2+2;
        console.log(calculation);
        console.log(calculation + 2);

        let result = calculation +2 ;
        console.log(result);

        let message = 'hello';
        console.log(message);

        variable1 = 5;
        console.log(variable1);

        variable1 = variable1 + 10;
        console.log(variable1);
    </script>



    <!-- Exercises  -->

    <script>
        let name = 'sahan';
        console.log(`My name is: ${name}`);

        let cost = 5 + (2*3) + 9;
        console.log(`Cost of Food: $${cost}`);

        let tax = cost * 0.1;
        console.log(`tax (10%): $${tax}`);

        let totalCost = cost + tax ;
        console.log(`Total cost: $${totalCost}`);
    </script>
</body>
</html>
