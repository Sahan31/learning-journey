<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body>

        <!-- Counter Project -->
        <div class="counter-container">
    
            <h1>Counter App</h1>
    
            <label id="countLabel">0</label>
    
            <div class="btn-container">
                <button id="decreaseBtn">Decrease</button>
                <button id="resetBtn">Reset</button>
                <button id="increaseBtn">Increase</button>
            </div>
    
        </div>
    
    
        <!-- Shopping Bill Calculator -->
        <div class="container">
    
            <h1>Shopping Bill Calculator</h1>
    
            <p class="subtitle">Calculate your shopping total</p>
    
            <div class="input-group">
                <label>Product Name</label>
                <input type="text" id="productName">
            </div>
    
            <div class="input-group">
                <label>Product Price</label>
                <input type="number" id="productPrice">
            </div>
    
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="quantity">
            </div>
    
            <button class="calculate-btn" id="calculate">
                Calculate Total
            </button>
    
            <div class="result">
                <h2>Shopping Bill</h2>
    
                <p id="nameShow">Product Name: —</p>
                <p id="priceShow">Product Price: —</p>
                <p id="quantityShow">Quantity: —</p>
    
                <div class="total">
                    <h3 id="totalShow">Total Price: —</h3>
                </div>
            </div>
    
        </div>



        <!-- Employee Salary Calculator ----  -->
        <div class="salary-container">

            <h1>Employee Salary Calculator</h1>
            <p class="subtitle">Calculate employee monthly salary</p>
        
            <div class="input-group">
                <label for="employeeName">Employee Name</label>
                <input type="text" id="employeeName" placeholder="Enter employee name">
            </div>
        
            <div class="input-group">
                <label for="basicSalary">Basic Salary (Rs.)</label>
                <input type="number" id="basicSalary" placeholder="Enter basic salary">
            </div>
        
            <div class="input-group">
                <label for="allowence">Allowance (Rs.)</label>
                <input type="number" id="allowence" placeholder="Enter allowance">
            </div>
        
            <div class="input-group">
                <label for="bonus">Bonus (Rs.)</label>
                <input type="number" id="bonus" placeholder="Enter bonus">
            </div>
        
            <button id="salaryCal">Calculate Salary</button>
        
            <div class="result">
                <h2>Employee Salary Report</h2>
        
                <p id="showName01"></p>
                <p id="showBasicSalary"></p>
                <p id="showallowence"></p>
                <p id="showBonus"></p>
        
                <div class="total">
                    <p id="showTotalSalary">Total Salary: —</p>
                </div>
            </div>
        
        </div>
            
        <script src="index.js"></script>
    
    </body>
</body>
</html>
