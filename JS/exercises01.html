    <label for="">radius:</label>
    <input type="text" id="z1in1">

    <script>
        const pi = 3.14159;
        let radius;
        let Circumference;

        document.getElementById('z1bt1').onclick = function() {
            radius = document.getElementById('z1in1').value;
            radius = Number(radius);
            Circumference = 2 * pi *radius;
            document.getElementById('z1p1').textContent = `${Circumference}cm`;
        }
    </script>
