<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- if statements = if a condition is true, execute some code 
                    if not, do something else  -->

    <script>
        let age = 13;
        if (age >= 18) {
            console.log("You are old enough to enter this site");
        } else {
            console.log("You must be 18+ to enter this site");
        }


        let isStudent = false;
        if (isStudent) {
            console.log("You are a Student");
        } else {
            console.log("You are not a Student"); 
        }


        let age01 = -1;
        if (age01 >= 18) {
            console.log("You are old enough to enter this site");
        } else if (age01 < 0) {
            console.log("Your age cant be below 0");
        } else {
            console.log("You are not old enough");
        }
    </script>
    

    <input type="text" placeholder="Enter your age" id="z1in1">
    <button id="z1bt1">Enter</button>
    <label for="" id="z1lb1"></label>

    <script>
        const ageEnter = document.getElementById('z1in1');
        const enterB = document.getElementById('z1bt1');
        const result = document.getElementById('z1lb1');
        let age02 ;

        enterB.onclick = function() {
            age02 = Number(ageEnter.value);
            if(age02 >= 18) {
                result.textContent = `You are old enough to enter this site`;
            } else if (age02 < 0) {
                result.textContent = `Your age cant be below 0`;
            } else {
                result.textContent = `You are not old enough`;
            }
        }

    </script>

    <br><br>


    <!-- checked property  -->

    <input type="checkbox" id="myCheckBox01" >
    <label for="myCheckBox">Subscribe</label><br><br>

    <input type="radio" name="card" id="myCheckBox02">
    <label for="myCheckBox">Visa</label><br>
    <input type="radio" name="card" id="myCheckBox03">
    <label for="myCheckBox">MasterCard</label><br>
    <input type="radio" name="card" id="myCheckBox04">
    <label for="myCheckBox">Paypal</label><br>
    <button id="submit">submit</button>
    <p id="result01"></p>
    <p id="result02"></p>



    <script>
        const sub = document.getElementById('myCheckBox01');
        const visa = document.getElementById('myCheckBox02');
        const master = document.getElementById('myCheckBox03');
        const paypal = document.getElementById('myCheckBox04');
        const submit = document.getElementById('submit');
        const finalResult = document.getElementById('result01');
        const finalPayment = document.getElementById('result02');


        submit.onclick = function () {
            if (sub.checked) {
                finalResult.textContent = `You are Subscribed!`;
            } else {
                finalResult.textContent = `You are not Subscribed`;
            }

            if (visa.checked) {
                finalPayment.textContent = `You are paying with VISA`;
            } else if (master.checked) {
                finalPayment.textContent = `You are paying with MASTER`;
 
            } else if (paypal.checked) {
                finalPayment.textContent = `You are paying with PAYPAL`;
 
            }
        }

    </script>



    <!-- ternary operator = consition ? codeiftrue : codeiffalse ; -->
    <script>
        let age03 = 17 ;
        let message = age03 >= 18 ? "you are an adult" : "You are a minor";
        console.log(message); 


        let time = 11 ;
        let finalTime = time < 12 ? "Good Morning!" : "Good evening!";
        console.log(finalTime);

        let isStudent01 = false ;
        let message01 = isStudent01 ? "You are a student" : "You are not a student";
        console.log(message01);

        let price = 120;
        let discount = price >= 100 ? 10 : 0;
        let finalPrice = price - (price * (discount / 100));
        console.log(`Your total is $${finalPrice}`);
    </script>

</body>
</html>
