 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        .box {
            @apply bg-black text-white w-10 h-10;
        }
    </style>
</head>
 <body>
    <!-- responsive -->
    <div class="h-40 bg-black sm:bg-blue-600 md:bg-pink-500"></div>

    

    <!-- Responsive design practice  -->
     <!-- 1. -->
     <div class="mt-3 w-40 h-40 bg-red-500 md:bg-green-500 lg:bg-blue-500">
        Level 1 Box
    </div>

    <!-- 2 -->
    <div class="p-5 text-sm text-left bg-gray-100 md:text-base md:text-center lg:text-lg lg:text-right">
        Tailwind Responsive Text
    </div>

    <!-- 3 -->
    <div class="flex gap-4 mt-3">
        <div class="p-4 bg-blue-200">Box 1</div>
        <div class="p-4 bg-blue-200">Box 2</div>
        <div class="p-4 bg-blue-200">Box 3</div>
    </div>
 
    
 </body>
 </html>
