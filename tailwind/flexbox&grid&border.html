<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <!-- display flex flex-wrap , order  -->
    <div class="flex flex-wrap">
        <div class="order-3 p-10 bg-red-500 w-100">box 1</div>
        <div class="order-2 p-10 bg-red-500 w-100">box 2</div>
        <div class="order-1 p-10 bg-red-500 w-100">box 3</div> 
    </div>


    <!-- justify-start , justify-end other ones are same as these -->
    <!-- align-items:center ; === items-center  -->



    <!-- grid  -->
    <div class="grid grid-cols-2 mt-2">
        <div class="p-10 bg-red-500 w-100">box 1</div>
        <div class="p-10 bg-red-500 w-100">box 2</div>
        <div class="p-10 bg-red-500 w-100">box 3</div> 
    </div>


    <!-- border  -->
     <div class="p-20 mt-2 bg-blue-500 w-[200px] ml-5 border-[10px] border-red-500">box 4</div>
   

</body>
</html>
