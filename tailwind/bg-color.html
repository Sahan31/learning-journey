<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background-colors</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="text-center">div</div>


    <!-- background-colors  -->
     
    <div class="p-2.5 text-center bg-red-500">red color</div>
    <!-- colors api kemathi ewa danna puluwan me widihata  -->
     <div class="bg-[#f1f1f1]">we can add define text</div>

     <!-- color opacity  -->
     <div class="p-2.5 text-center bg-red-500/5">red color</div>
     <div class="p-2.5 text-center bg-red-500/50">red color</div>

     <!-- gradiants  -->
      <div class="bg-gradient-to-r from-red-500 via-yellow-500 to-blue-400 h-[100px]">color gradients</div>

</body>
</html>
